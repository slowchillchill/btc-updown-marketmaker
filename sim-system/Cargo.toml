[package]
name = "sim-system"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
public-consumption = ["dep:data-pipeline-training"]
measurement = ["tokio/rt"]
gate-a-measurement = ["measurement", "dep:data-pipeline-training"]
gate-b-flow = ["gate-a-measurement", "dep:ledger"]

[dependencies]
contracts = { path = "../contracts" }
data-pipeline-core = { path = "../data-pipeline/core" }
data-pipeline-training = { path = "../data-pipeline/training", optional = true }
execution-normalization = { path = "../execution-normalization" }
ledger = { path = "../ledger", optional = true }
num-bigint = "=0.4.8"
num-integer = "=0.1.46"
num-traits = "=0.2.19"
polymarket_client_sdk_v2 = { version = "=0.7.0", default-features = false, features = ["clob"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["query", "rustls"] }
rust_decimal = { version = "=1.42.1", default-features = false, features = ["serde", "std"] }
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "std"] }
serde = { version = "=1.0.228", features = ["derive", "rc"] }
serde_json = { version = "=1.0.150", features = ["raw_value"] }
sha2 = "=0.10.9"
tokio = { version = "=1.52.3", default-features = false, features = ["time"] }
# Cargo 的版本约束忽略 SemVer 构建元数据；Cargo.lock 绑定实际的
# 1.1.4+spec-1.1.0 包。
toml = { version = "=1.1.4", default-features = false, features = ["parse", "serde", "std"] }

[dev-dependencies]
data-pipeline-training = { path = "../data-pipeline/training" }
tempfile = "=3.27.0"
tokio = { version = "=1.52.3", default-features = false, features = ["io-util", "macros", "net", "rt", "test-util", "time"] }
