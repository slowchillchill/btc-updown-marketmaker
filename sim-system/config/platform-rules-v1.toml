scope = "GTD 声明截止至少提前180秒；实际截止为声明截止减60秒"
limitation = "minimum_lead_seconds=120 表示有效最低提前量，声明提前量再加 safety_offset_seconds=60。SIM按SDK整秒编码及精确毫秒时长比较，未声称测得服务器内部时钟精度。"
version = "POLYMARKET_GTD_EFFECTIVE_EXPIRY_V1"
failure_semantics = "编码秒 < ceil(processing_ms/1000)+120+60 时在状态变化前拒单；等号接受"

