[package]
name = "data-pipeline-training"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
arrow-array = { version = "=59.0.0", default-features = false }
arrow-ord = { version = "=59.0.0", default-features = false }
arrow-schema = { version = "=59.0.0", default-features = false }
contracts = { path = "../../contracts" }
data-pipeline-core = { path = "../core" }
parquet = { version = "=59.0.0", default-features = false, features = ["arrow", "zstd"] }
rustix = { version = "=1.1.4", default-features = false, features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
time = { version = "=0.3.53", default-features = false, features = ["macros", "parsing"] }

[dev-dependencies]
tempfile = "=3.27.0"
