[package]
name = "data-pipeline-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ciborium = "=0.2.2"
rayon = "=1.12.0"
base64 = "0.22.1"
contracts = { path = "../../contracts" }
rust_decimal = { version = "=1.42.1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
alloy-primitives = { version = "=1.6.0", default-features = false, features = ["serde"] }
