[package]
name = "model-native-inputs"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
python = ["dep:pyo3"]
ort = ["dep:ort"]
continuous-validation = ["python", "ort", "sim-system/measurement"]

[workspace]

[dependencies]
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["std", "load-dynamic", "api-27"] }
pyo3 = { version = "=0.29.2", optional = true, features = ["auto-initialize"] }
contracts = { path = "../../contracts" }
shared-run = { path = "../../shared-run" }
ledger = { path = "../../ledger" }
execution-normalization = { path = "../../execution-normalization" }
sim-system = { path = "../../sim-system", features = ["shared-execution"] }
num-bigint = "=0.4.8"
num-integer = "=0.1.46"
num-traits = "=0.2.19"
rust_decimal = { version = "=1.42.1", default-features = false, features = ["std"] }
serde = { version = "=1.0.228", features = ["derive", "rc"] }
serde_json = "=1.0.150"
rayon = "=1.12.0"

[dev-dependencies]
backtest = { path = "../../backtest" }
data-pipeline-core = { path = "../../data-pipeline/core" }
data-pipeline-training = { path = "../../data-pipeline/training" }
tempfile = "=3.27.0"
sha2 = "=0.10.9"
tokio = { version = "=1.52.3", features = ["macros", "rt"] }

[patch.crates-io]
polymarket_client_sdk_v2 = { path = "../../third_party/polymarket_client_sdk_v2-0.7.0-p1" }
