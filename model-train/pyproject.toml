[project]
name = "model-train"
version = "0.1.0"
description = "模型训练的可复用纯计算组件"
requires-python = "==3.13.15"
dependencies = ["torch==2.11.0"]

[tool.uv]
required-version = "==0.12.9"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
