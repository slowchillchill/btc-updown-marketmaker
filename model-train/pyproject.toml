[project]
name = "model-train"
version = "0.1.0"
description = "模型训练的可复用纯计算组件"
requires-python = "==3.13.15"
dependencies = ["torch==2.11.0", "onnx==1.22.0", "onnxruntime==1.28.0", "onnxscript==0.7.1", "numpy==2.5.3", "maturin==1.15.0", "torchrl==0.13.3", "tensordict==0.13.0", "mlflow==3.15.2"]

[tool.uv]
required-version = "==0.12.9"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.maturin]
manifest-path = "native-inputs/Cargo.toml"
module-name = "model_native_inputs"
features = ["python"]

[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"
