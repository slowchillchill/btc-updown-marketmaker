[package]
name = "data-collect"
version = "0.1.0"
edition = "2024"

[lib]
name = "data_collect"
path = "src/lib.rs"
bench = false

[dependencies]
arrow-array = "59.0.0"
arrow-schema = "59.0.0"
base64 = "0.22.1"
futures = "0.3"
libc = "0.2"
parquet = "59.0.0"
polymarket_client_sdk_v2 = { version = "=0.7.0", features = ["clob", "gamma", "rtds", "ws"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = "0.3.53"
tokio = { version = "1.49.0", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-native-roots"] }

[[bin]]
name = "data-collect-training-collector"
path = "src/bin/data_collect_training_collector.rs"

[[bin]]
name = "data-collect-paper-hot"
path = "src/bin/data_collect_paper_hot.rs"

[[bin]]
name = "data-collect-live-hot"
path = "src/bin/data_collect_live_hot.rs"

[[bin]]
name = "real_source_alignment_probe"
path = "src/bin/real_source_alignment_probe.rs"
bench = false

[[bin]]
name = "data-collect-price-anchor-backfill"
path = "src/bin/data_collect_price_anchor_backfill.rs"
bench = false

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.49.0", features = ["test-util"] }
