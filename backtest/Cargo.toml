[package]
name = "backtest"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
contracts = { path = "../contracts" }
data-pipeline-core = { path = "../data-pipeline/core" }
data-pipeline-training = { path = "../data-pipeline/training" }
sim-system = { path = "../sim-system", features = ["shared-execution"] }
shared-run = { path = "../shared-run" }
ledger = { path = "../ledger" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tokio = { version = "=1.52.3", features = ["rt"] }
ciborium = "=0.2.2"
sha2 = "=0.10.9"

[dev-dependencies]
parquet = { version = "=59.0.0", default-features = false, features = ["arrow", "zstd"] }
execution-normalization = { path = "../execution-normalization" }
num-bigint = "=0.4.8"
data-collect = { path = "../data-collect" }
rust_decimal = { version = "=1.42.1", default-features = false, features = ["std"] }
tempfile = "=3.27.0"
tokio = { version = "=1.52.3", features = ["macros", "rt"] }
