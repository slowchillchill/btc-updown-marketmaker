[package]
name = "shared-run"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ciborium = "=0.2.2"
contracts = { path = "../contracts" }
execution-normalization = { path = "../execution-normalization" }
ledger = { path = "../ledger" }
intent-bridge = { path = "../intent-bridge" }
sim-system = { path = "../sim-system", features = ["shared-execution"] }
num-bigint = "=0.4.8"
num-traits = "=0.2.19"
rust_decimal = { version = "=1.42.1", default-features = false, features = ["std"] }

data-pipeline-training = { path = "../data-pipeline/training" }
serde_json = "=1.0.150"
serde = { version = "=1.0.228", features = ["derive"] }
tokio = { version = "=1.52.3", default-features = false, features = ["macros", "rt", "net", "io-util", "time", "signal"] }
[dev-dependencies]
data-pipeline-core = { path = "../data-pipeline/core" }
sha2 = "=0.10.9"
tempfile = "=3.27.0"
data-collect = { path = "../data-collect" }
