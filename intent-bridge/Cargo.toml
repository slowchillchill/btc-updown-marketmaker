[package]
name = "intent-bridge"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
contracts = { path = "../contracts" }
polymarket_client_sdk_v2 = { version = "=0.7.0", default-features = false, features = ["clob"] }
sim-system = { path = "../sim-system" }

[dev-dependencies]
data-pipeline-core = { path = "../data-pipeline/core" }
serde_json = "=1.0.150"
tempfile = "=3.27.0"
tokio = { version = "=1.52.3", default-features = false, features = ["io-util", "macros", "net", "rt", "time"] }
