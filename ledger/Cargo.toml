[package]
name = "ledger"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
contracts = { path = "../contracts" }
execution-normalization = { path = "../execution-normalization" }
rust_decimal = { version = "=1.42.1", default-features = false, features = ["serde-str", "std"] }
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "std"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"

[dev-dependencies]
tempfile = "=3.27.0"
