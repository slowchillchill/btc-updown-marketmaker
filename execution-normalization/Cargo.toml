[package]
name = "execution-normalization"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
arrow-array = { version = "=59.0.0", default-features = false }
arrow-schema = { version = "=59.0.0", default-features = false }
parquet = { version = "=59.0.0", default-features = false, features = ["arrow", "zstd"] }
contracts = { path = "../contracts" }
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "std"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"

[dev-dependencies]
tempfile = "=3.27.0"
