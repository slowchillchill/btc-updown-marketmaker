[package]
name = "contracts"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rust_decimal = { version = "=1.42.1", default-features = false, features = ["std", "serde"] }
serde = { version = "1", features = ["derive", "rc"] }
num-bigint = "=0.4.8"
num-integer = "=0.1.46"
num-traits = "=0.2.19"
alloy-primitives = { version = "=1.6.0", default-features = false, features = ["serde"] }
imbl = { version = "=7.0.2", features = ["serde"] }
elsa = "=1.11.2"
