[package]
name = "baseline-mm"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
contracts = { path = "../contracts" }
shared-run = { path = "../shared-run" }
ledger = { path = "../ledger" }
execution-normalization = { path = "../execution-normalization" }
sim-system = { path = "../sim-system", features = ["shared-execution"] }
rust_decimal = { version = "=1.42.1", default-features = false, features = ["std", "serde-str"] }
num-bigint = "=0.4.8"
num-traits = "=0.2.19"
serde = { version = "=1.0.228", features = ["derive"] }
toml = { version = "=1.1.4", default-features = false, features = ["parse", "serde", "std"] }
libm = "=0.2.16"

[dev-dependencies]
data-pipeline-core = { path = "../data-pipeline/core" }
data-pipeline-training = { path = "../data-pipeline/training" }
data-collect = { path = "../data-collect" }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
tokio = { version = "=1.52.3", default-features = false, features = ["macros", "rt"] }
zstd = "=0.13.3"
